name: Replace Covers

on:
  push:
    paths:
      - 'replace_requests.json'  # triggers only when this file changes

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run replace_cover.py
        run: python replace_cover.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add images
          git diff --cached --quiet || git commit -m "Replace covers from replace_requests.json"
          git push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}  # your token for pushing
