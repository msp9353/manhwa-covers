name: Replace Cover Images

permissions:
  contents: write  # allows committing to repo

on:
  workflow_dispatch:  # manual trigger

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run replace_cover.py
        run: python replace_cover.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add images docs/covers.json replace_requests.json
          git diff --cached --quiet || git commit -m "Applied replacement requests"
          git push
