name: Replace Cover

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Title of the manga"
        required: true
      new_url:
        description: "New cover image URL"
        required: true

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run replace_cover.py
        run: |
          python replace_cover.py "${{ github.event.inputs.title }}" "${{ github.event.inputs.new_url }}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add images
          git diff --cached --quiet || git commit -m "Replace cover image: ${{ github.event.inputs.title }}"
          git push
