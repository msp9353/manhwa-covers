name: Update Covers

on:
  workflow_dispatch: # Only run manually

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo with credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # <-- allows push with GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run update_covers.py
        run: python update_covers.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add images
          git diff --cached --quiet || git commit -m "Update cover images" && git push
