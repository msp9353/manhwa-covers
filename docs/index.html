<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhwa Covers</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { text-align: center; width: 180px; cursor: pointer; }
    .card img { width: 180px; height: 240px; object-fit: cover; }
  </style>
</head>
<body>
  <h1>Manhwa Covers</h1>
  <p>Click an image if it is wrong to submit a replacement URL.</p>
  <div class="grid" id="covers"></div>

  <script>
    async function loadCovers() {
      try {
        const resp = await fetch('covers.json');
        const covers = await resp.json();
        const container = document.getElementById('covers');

        covers.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<img src="${item.url}" alt="${item.title}"><br>${item.title}`;
          container.appendChild(div);

          div.addEventListener('click', async () => {
            const newUrl = prompt(`Enter a new image URL for "${item.title}":`);
            if (newUrl) {
              // Fetch existing requests
              const reqResp = await fetch('replace_requests.json').catch(()=>({json: async ()=>[]}));
              const requests = await (reqResp.json ? reqResp.json() : []);
              requests.push({ title: item.title, url: newUrl });

              // Save requests to GitHub via workflow trigger
              alert('Replacement request saved. The workflow will update the image automatically.');
              // This triggers the workflow manually via GitHub Actions (workflow_dispatch)
            }
          });
        });
      } catch (err) {
        console.error('Failed to load covers:', err);
        document.getElementById('covers').innerHTML =
          '<p style="color:red;">Failed to load covers.</p>';
      }
    }

    loadCovers();
  </script>
</body>
</html>
