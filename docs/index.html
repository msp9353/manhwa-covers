<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manhwa Covers</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .card { text-align: center; width: 180px; }
  .card img { width: 180px; height: 240px; object-fit: cover; }
</style>
</head>
<body>
<h1>Manhwa Covers</h1>
<div class="grid" id="covers">
  <!-- Covers will be loaded here -->
</div>

<script>
async function loadCovers() {
  try {
    const response = await fetch('covers.json');  // JSON is in docs/covers.json relative to this page
    const covers = await response.json();

    const container = document.getElementById('covers');

    covers.forEach(cover => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <img src="${cover.path}" alt="${cover.title}">
        <br>${cover.title}
      `;
      container.appendChild(div);
    });
  } catch (error) {
    console.error('Error loading covers:', error);
    const container = document.getElementById('covers');
    container.innerHTML = '<p>Failed to load covers.</p>';
  }
}

loadCovers();
</script>
</body>
</html>
