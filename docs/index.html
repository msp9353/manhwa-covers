<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manhwa Covers</title>
<style>
  body { font-family: Arial; margin: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .card { text-align: center; width: 180px; }
  .card img { width: 180px; height: 120px; object-fit: cover; }
</style>
</head>
<body>
<h1>My Manhwa Covers</h1>
<div class="grid" id="covers">
  <!-- Covers will be loaded here -->
</div>

<script>
const covers = [
  { title: "Survival story of a sword king", image: "../images/Survival story of a sword king in a fantasy world.jpg" },
  { title: "Tale of a scribe", image: "../images/Tale of a scribe.jpg" }
  // Add more manually or dynamically later
];

const container = document.getElementById("covers");

covers.forEach(c => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `<img src="${c.image}" alt="${c.title}"><br>${c.title}`;
  container.appendChild(div);
});
</script>
</body>
</html>
