<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhwa Covers</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { text-align: center; width: 180px; cursor: pointer; }
    .card img { width: 180px; height: 240px; object-fit: cover; }
  </style>
</head>
<body>
  <h1>Manhwa Covers</h1>
  <p>Click an image if it is wrong to submit a replacement URL.</p>
  <div class="grid" id="covers">
    <!-- Covers will be loaded here -->
  </div>

  <script>
    async function loadCovers() {
      try {
        const resp = await fetch('covers.json');
        const covers = await resp.json();
        const container = document.getElementById('covers');

        covers.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<img src="${item.url}" alt="${item.title}"><br>${item.title}`;
          container.appendChild(div);

          // Click event to request a replacement
          div.addEventListener('click', async () => {
            const newUrl = prompt(`Enter a new image URL for "${item.title}":`);
            if (newUrl) {
              // Add the request to replace_requests.json
              // We can't push to repo from browser, so we create/update localStorage as placeholder
              let requests = JSON.parse(localStorage.getItem('replace_requests') || '[]');
              requests.push({ title: item.title, newUrl });
              localStorage.setItem('replace_requests', JSON.stringify(requests));
              alert('Replacement request saved. Trigger the update workflow to apply it.');
            }
          });
        });
      } catch (err) {
        console.error('Failed to load covers:', err);
        const container = document.getElementById('covers');
        container.innerHTML = '<p style="color:red;">Failed to load covers.</p>';
      }
    }

    loadCovers();
  </script>
</body>
</html>
