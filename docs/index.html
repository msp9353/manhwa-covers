<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhwa Covers</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { text-align: center; width: 180px; cursor: pointer; }
    .card img { width: 180px; height: 240px; object-fit: cover; }
    .pending { border: 4px solid red; }
    #downloadBtn { margin-bottom: 20px; padding: 10px 15px; font-size: 16px; cursor: pointer; }

    /* Modal styles */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0; top: 0; width: 100%; height: 100%; 
      overflow: auto; background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 300px; border-radius: 5px;
      text-align: center;
    }
    .modal input { width: 100%; padding: 5px; margin-top: 10px; }
    .modal button { margin-top: 10px; padding: 5px 10px; }
  </style>
</head>
<body>
  <h1>Manhwa Covers</h1>
  <p>Click an image to submit a replacement URL.</p>
  <button id="downloadBtn">Download Replacement Requests</button>
  <div class="grid" id="covers"></div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <p id="modalTitle"></p>
      <input type="text" id="newUrlInput" placeholder="Enter new image URL">
      <br>
      <button id="okBtn">OK</button>
      <button id="cancelBtn">Cancel</button>
    </div>
  </div>

  <script>
    let currentItem = null; // store clicked image info

    async function loadCovers() {
      try {
        const resp = await fetch('covers.json');
        const covers = await resp.json();
        const container = document.getElementById('covers');
        const existingRequests = JSON.parse(localStorage.getItem('replace_requests') || '[]');

        covers.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<img src="${item.url}" alt="${item.title}"><br>${item.title}`;

          const imgEl = div.querySelector('img');
          if (existingRequests.some(req => req.title === item.title)) {
            imgEl.classList.add('pending');
          }

          div.addEventListener('click', async () => {
            // Copy "title cover" to clipboard
            try {
              await navigator.clipboard.writeText(`${item.title} cover`);
            } catch(e) {
              console.error("Clipboard failed:", e);
            }

            // Show modal
            currentItem = item;
            document.getElementById('modalTitle').textContent = `Replace image for "${item.title}"`;
            document.getElementById('newUrlInput').value = '';
            document.getElementById('modal').style.display = 'block';
            document.getElementById('newUrlInput').focus();
          });

          container.appendChild(div);
        });
      } catch (err) {
        console.error('Failed to load covers:', err);
        document.getElementById('covers').innerHTML =
          '<p style="color:red;">Failed to load covers.</p>';
      }
    }

    // Modal buttons
    document.getElementById('okBtn').addEventListener('click', () => {
      const newUrl = document.getElementById('newUrlInput').value.trim();
      if (newUrl && currentItem) {
        let requests = JSON.parse(localStorage.getItem('replace_requests') || '[]');
        const existingIndex = requests.findIndex(req => req.title === currentItem.title);
        if (existingIndex >= 0) {
          requests[existingIndex].newUrl = newUrl;
        } else {
          requests.push({ title: currentItem.title, newUrl });
        }
        localStorage.setItem('replace_requests', JSON.stringify(requests));

        // Mark image as pending
        document.querySelectorAll('.card').forEach(div => {
          const imgEl = div.querySelector('img');
          if (imgEl.alt === currentItem.title) imgEl.classList.add('pending');
        });
      }
      document.getElementById('modal').style.display = 'none';
      currentItem = null;
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.getElementById('modal').style.display = 'none';
      currentItem = null;
    });

    // Download JSON
    function downloadRequests() {
      const requests = localStorage.getItem('replace_requests') || '[]';
      const blob = new Blob([requests], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'replace_requests.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      // Clear localStorage and pending class
      localStorage.removeItem('replace_requests');
      document.querySelectorAll('.card img.pending').forEach(img => img.classList.remove('pending'));
    }

    document.getElementById('downloadBtn').addEventListener('click', downloadRequests);
    loadCovers();
  </script>
</body>
</html>
