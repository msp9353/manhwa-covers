<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manhwa Covers</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .card { text-align: center; width: 180px; }
  .card img { width: 180px; height: 120px; object-fit: cover; }
</style>
</head>
<body>
<h1>Manhwa Covers</h1>
<div class="grid" id="covers">
  <!-- Covers will be loaded here -->
</div>

<script>
async function loadCovers() {
  // Fetch the list of files from the images folder using the GitHub API
  const repoOwner = "YOUR_USERNAME";
  const repoName = "YOUR_REPO";
  const folderPath = "images";
  const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;

  const response = await fetch(apiUrl);
  const files = await response.json();

  const container = document.getElementById("covers");

  files.forEach(file => {
    if(file.type === "file" && file.download_url.endsWith(".jpg")) {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<img src="${file.download_url}" alt="${file.name}"><br>${file.name.replace(".jpg","")}`;
      container.appendChild(div);
    }
  });
}

loadCovers();
</script>
</body>
</html>
