<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhwa Covers</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { text-align: center; width: 180px; cursor: pointer; }
    .card img { width: 180px; height: 240px; object-fit: cover; }
    .pending { border: 4px solid red; }
    #downloadBtn { margin-bottom: 20px; padding: 10px 15px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Manhwa Covers</h1>
  <p>Click an image if it is wrong to submit a replacement URL.</p>
  <button id="downloadBtn">Download Replacement Requests</button>
  <div class="grid" id="covers">
    <!-- Covers will be loaded here -->
  </div>

  <script>
    // Load the covers
    async function loadCovers() {
      try {
        const resp = await fetch('covers.json');
        const covers = await resp.json();
        const container = document.getElementById('covers');

        // Load existing replacement requests from localStorage
        const existingRequests = JSON.parse(localStorage.getItem('replace_requests') || '[]');

        covers.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<img src="${item.url}" alt="${item.title}"><br>${item.title}`;

          // Mark if there is already a replacement request
          if (existingRequests.some(req => req.title === item.title)) {
            div.querySelector('img').classList.add('pending');
          }

          container.appendChild(div);

          // Click to submit a replacement URL
          div.addEventListener('click', () => {
            const newUrl = prompt(`Enter a new image URL for "${item.title}":`);
            if (newUrl) {
              let requests = JSON.parse(localStorage.getItem('replace_requests') || '[]');

              // Check if a request already exists for this title
              const existingIndex = requests.findIndex(req => req.title === item.title);
              if (existingIndex >= 0) {
                requests[existingIndex].newUrl = newUrl; // Update existing
              } else {
                requests.push({ title: item.title, newUrl }); // Add new
              }

              localStorage.setItem('replace_requests', JSON.stringify(requests));
              div.querySelector('img').classList.add('pending'); // mark visually
              alert('Replacement request saved! You can now download it.');
            }
          });
        });
      } catch (err) {
        console.error('Failed to load covers:', err);
        document.getElementById('covers').innerHTML =
          '<p style="color:red;">Failed to load covers.</p>';
      }
    }

    // Download the JSON file
    function downloadRequests() {
      const requests = localStorage.getItem('replace_requests') || '[]';
      const blob = new Blob([requests], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'replace_requests.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      // Clear all requests from localStorage
      localStorage.removeItem('replace_requests');

      // Remove red border from all images
      document.querySelectorAll('.card img.pending').forEach(img => {
        img.classList.remove('pending');
      });
    }

    // Set up download button
    document.getElementById('downloadBtn').addEventListener('click', downloadRequests);

    // Initialize
    loadCovers();
  </script>
</body>
</html>
