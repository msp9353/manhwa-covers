<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manhwa Covers</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { text-align: center; width: 180px; cursor: pointer; }
    .card img { width: 180px; height: 240px; object-fit: cover; }
  </style>
</head>
<body>
  <h1>Manhwa Covers</h1>
  <p>Click an image if it is wrong to submit a replacement URL.</p>
  <div class="grid" id="covers">
    <!-- Covers will be loaded here -->
  </div>

  <script>
    const REPO_OWNER = "msp9353";
    const REPO_NAME = "manhwa-covers";
    const WORKFLOW_ID = "replace_cover.yml"; // workflow filename
    const GH_PAT = "<GH_PAT>"; // replace with your PAT

    async function triggerReplaceWorkflow(title, newUrl) {
      const response = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`,
        {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${GH_PAT}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            ref: "main",
            inputs: { title, new_url: newUrl }
          })
        }
      );
      if (response.ok) {
        alert(`Replacement workflow triggered for "${title}".`);
      } else {
        alert(`Failed to trigger workflow: ${response.status}`);
      }
    }

    async function loadCovers() {
      try {
        const resp = await fetch('covers.json');
        const covers = await resp.json();
        const container = document.getElementById('covers');

        covers.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<img src="${item.url}" alt="${item.title}"><br>${item.title}`;
          container.appendChild(div);

          div.addEventListener('click', async () => {
            const newUrl = prompt(`Enter a new image URL for "${item.title}":`);
            if (newUrl) {
              triggerReplaceWorkflow(item.title, newUrl);
            }
          });
        });
      } catch (err) {
        console.error('Failed to load covers:', err);
        document.getElementById('covers').innerHTML =
          '<p style="color:red;">Failed to load covers.</p>';
      }
    }

    loadCovers();
  </script>
</body>
</html>
